name: Run Blackbox Harvest

on:
  workflow_dispatch: # Manual run button

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Chromium & Driver)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium chromium-driver

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Harvest Script
        env:
          PYTHONUNBUFFERED: "1" # Forces print statements to show up live in the logs
        run: python blackbox_harvest.py

      - name: Save updated database back to repository
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add daraz_intelligence.db
          git commit -m "Auto-update SQLite database from GitHub Actions harvest" || echo "No changes to commit"
          git push
